<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Using voice on a phone</title><desc id="desc">Illustrative mobile voice interaction with a voice control, speaking indicator and conversation transcript</desc><rect x="0" y="0" width="1200" height="720" rx="0" fill="#F4F7F6" stroke="none" stroke-width="1"/><rect x="25" y="22" width="1150" height="676" rx="20" fill="#fff" stroke="#C8D7DA" stroke-width="2"/><rect x="25" y="22" width="1150" height="54" rx="20" fill="#F8FAFB" stroke="none" stroke-width="1"/><circle cx="56" cy="49" r="7" fill="#EE9A93"/><circle cx="79" cy="49" r="7" fill="#F1CF7A"/><circle cx="102" cy="49" r="7" fill="#99D0C5"/><text x="1100" y="53" fill="#627783" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="end">ILLUSTRATED GUIDE · NOT A SCREENSHOT</text><rect x="100" y="116" width="430" height="516" rx="24" fill="#E9F0F1" stroke="none" stroke-width="1"/><text x="130" y="165" fill="#1A3546" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="start">Why use voice?</text><text x="130" y="217" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">• Practise Spanish conversation</text><text x="130" y="264" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">• Ask questions while cooking</text><text x="130" y="311" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">• Dictate without typing</text><text x="130" y="358" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">• Ask for a slower explanation</text><text x="130" y="429" fill="#526E79" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start">Voice can be started from the</text><text x="130" y="457" fill="#526E79" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start">microphone or voice control.</text><rect x="662" y="91" width="345" height="584" rx="37" fill="#1C3040" stroke="none" stroke-width="1"/><rect x="676" y="106" width="317" height="554" rx="28" fill="#fff" stroke="none" stroke-width="1"/><text x="834" y="150" fill="#253F4B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="750" text-anchor="middle">ChatGPT</text><rect x="702" y="180" width="264" height="134" rx="16" fill="#F3F8F7" stroke="none" stroke-width="1"/><text x="722" y="216" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Let's practise Spanish.</text><text x="722" y="248" fill="#557079" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start">Start with basic greetings.</text><text x="722" y="287" fill="#557079" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start">Ready when you are.</text><text x="834" y="385" fill="#2D5360" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Listening...</text><circle cx="834" cy="455" r="39" fill="none" stroke="#8CCBC2" stroke-opacity="0.9" stroke-width="5"/><circle cx="834" cy="455" r="49" fill="none" stroke="#8CCBC2" stroke-opacity="0.73" stroke-width="5"/><circle cx="834" cy="455" r="59" fill="none" stroke="#8CCBC2" stroke-opacity="0.56" stroke-width="5"/><circle cx="834" cy="455" r="69" fill="none" stroke="#8CCBC2" stroke-opacity="0.39" stroke-width="5"/><text x="834" y="461" fill="#197F78" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">●</text><rect x="722" y="573" width="227" height="52" rx="16" fill="#EDF2F2" stroke="none" stroke-width="1"/><text x="739" y="606" fill="#375C65" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Exit voice</text><circle cx="1008" cy="444" r="20" fill="#E58E70" stroke="#fff" stroke-width="4"/><text x="1008" y="451" fill="#12263C" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="middle">1</text><circle cx="974" cy="592" r="20" fill="#E58E70" stroke="#fff" stroke-width="4"/><text x="974" y="599" fill="#12263C" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="middle">2</text></svg>