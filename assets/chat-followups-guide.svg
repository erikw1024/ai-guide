<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Asking and refining questions</title><desc id="desc">Illustrative conversation showing a first request and a follow-up that changes the format</desc><rect x="0" y="0" width="1200" height="720" rx="0" fill="#F4F7F6" stroke="none" stroke-width="1"/><rect x="25" y="22" width="1150" height="676" rx="20" fill="#fff" stroke="#C8D7DA" stroke-width="2"/><rect x="25" y="22" width="1150" height="54" rx="20" fill="#F8FAFB" stroke="none" stroke-width="1"/><circle cx="56" cy="49" r="7" fill="#EE9A93"/><circle cx="79" cy="49" r="7" fill="#F1CF7A"/><circle cx="102" cy="49" r="7" fill="#99D0C5"/><text x="1100" y="53" fill="#627783" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="end">ILLUSTRATED GUIDE · NOT A SCREENSHOT</text><rect x="26" y="77" width="265" height="619" rx="0" fill="#F3F6F5" stroke="none" stroke-width="1"/><text x="53" y="117" fill="#193349" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">ChatGPT</text><text x="52" y="157" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">＋  New chat</text><text x="52" y="210" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">⌕  Search chats</text><text x="52" y="263" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">▦  Library</text><text x="52" y="316" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">◎  Explore</text><text x="52" y="369" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">▣  Projects</text><text x="52" y="422" fill="#4C6D71" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">  Building matters</text><text x="52" y="475" fill="#4C6D71" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">  Home finances</text><text x="52" y="528" fill="#4C6D71" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">  Learning ChatGPT</text><line x1="38" y1="614" x2="281" y2="614" stroke="#DCE5E7" stroke-width="2" stroke-linecap="round"/><text x="52" y="657" fill="#344D5B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">⚙  Settings</text><rect x="378" y="127" width="754" height="92" rx="22" fill="#F1F4F4" stroke="none" stroke-width="1"/><text x="403" y="166" fill="#0B7770" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" text-anchor="start">You</text><text x="403" y="198" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start">Help me understand this electricity bill.</text><rect x="348" y="252" width="782" height="198" rx="18" fill="#fff" stroke="#DFE5E6" stroke-width="2"/><text x="374" y="286" fill="#1B3547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" text-anchor="start">ChatGPT</text><text x="374" y="330" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start">I can explain the charges, usage and tariff.</text><text x="374" y="369" fill="#536A75" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start">Upload the bill, or paste the amounts you want to check.</text><rect x="401" y="480" width="704" height="74" rx="20" fill="#E1F0EC" stroke="none" stroke-width="1"/><text x="427" y="506" fill="#0B7770" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" text-anchor="start">You · follow-up</text><text x="427" y="535" fill="#233449" font-family="Arial, Helvetica, 