jects</text><text x="52" y="422" fill="#4C6D71" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">  Building matters</text><text x="52" y="475" fill="#4C6D71" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">  Home finances</text><text x="52" y="528" fill="#4C6D71" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">  Learning ChatGPT</text><line x1="38" y1="614" x2="281" y2="614" stroke="#DCE5E7" stroke-width="2" stroke-linecap="round"/><text x="52" y="657" fill="#344D5B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">⚙  Settings</text><text x="671" y="228" fill="#1B3547" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">What can I help with?</text><rect x="365" y="341" width="730" height="118" rx="26" fill="#F8FAFA" stroke="#BFCFD3" stroke-width="2"/><text x="393" y="385" fill="#788B94" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start">Ask a question, or describe what you need...</text><text x="390" y="434" fill="#4D6B76" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" text-anchor="start">＋</text><text x="1024" y="435" fill="#334A56" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" text-anchor="start">🎙</text><rect x="1060" y="406" width="43" height="39" rx="17" fill="#1D3B45" stroke="none" stroke-width="1"/><text x="1082" y="434" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="middle">➤</text><circle cx="88" cy="155" r="20" fill="#E58E70" stroke="#fff" stroke-width="4"/><text x="88" y="162" fill="#12263C" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="middle">1</text><circle cx="275" cy="259" r="20" fill="#E58E70" stroke="#fff" stroke-width="