<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Think, check and improve</title><desc>LEARNING AND CRITICAL THINKING</desc><rect width="1200" height="700" fill="#F1F7F4"/><circle cx="1112" cy="30" r="215" fill="#DAF0E8"/><circle cx="72" cy="665" r="145" fill="#FCE7D7"/><text x="74" y="80" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#0E786F">LEARNING AND CRITICAL THINKING</text><text x="74" y="142" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#1F3F50">Think, check and improve</text><rect x="65" y="238" width="258" height="302" rx="19" fill="#F0F7F4" stroke="#D6E2E1" stroke-width="2"/><rect x="86" y="269" width="65" height="65" rx="18" fill="#DCECE8" stroke="#D6E2E1" stroke-width="2"/><text x="107" y="313" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#0E776F">1</text><text x="87" y="397" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" fill="#1D4657">Ask</text><text x="87" y="440" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#5C7780">A clear question</text><rect x="351" y="238" width="258" height="302" rx="19" fill="#FFF9F2" stroke="#D6E2E1" stroke-width="2"/><rect x="372" y="269" width="65" height="65" rx="18" fill="#DCECE8" stroke="#D6E2E1" stroke-width="2"/><text x="393" y="313" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#0E776F">2</text><text x="373" y="397" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" fill="#1D4657">Explain</text><text x="373" y="440" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#5C7780">A simple answer</text><rect x="637" y="238" width="258" height="302" rx="19" fill="#F0F7F4" stroke="#D6E2E1" stroke-width="2"/><rect x="658" y="269" width="65" height="65" rx="18" fill="#DCECE8" stroke="#D6E2E1" stroke-width="2"/><text x="679" y="313" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#0E776F">3</text><text x="659" y="397" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" fill="#1D4657">Check</text><text x="659" y="440" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#5C7780">Original evidence</text><rect x="923" y="238" width="258" height="302" rx="19" fill="#FFF9F2" stroke="#D6E2E1" stroke-width="2"/><rect x="944" y="269" width="65" height="65" rx="18" fill="#DCECE8" stroke="#D6E2E1" stroke-width="2"/><text x="965" y="313" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#0E776F">4</text><text x="945" y="397" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" fill="#1D4657">Improve</text><text x="945" y="440" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#5C7780">A better follow-up</text><rect x="135" y="590" width="930" height="55" rx="12" fill="#fff" stroke="#D6E2E1" stroke-width="2"/><text x="166" y="626" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="680" fill="#386A70">A convincing answer is not necessarily a correct one. Check the evidence.</text></svg>