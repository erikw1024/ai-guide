<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Search and verify sources</title><desc id="desc">Illustrative research response with source links, publication dates, verification actions</desc><rect x="0" y="0" width="1200" height="720" rx="0" fill="#F4F7F6" stroke="none" stroke-width="1"/><rect x="25" y="22" width="1150" height="676" rx="20" fill="#fff" stroke="#C8D7DA" stroke-width="2"/><rect x="25" y="22" width="1150" height="54" rx="20" fill="#F8FAFB" stroke="none" stroke-width="1"/><circle cx="56" cy="49" r="7" fill="#EE9A93"/><circle cx="79" cy="49" r="7" fill="#F1CF7A"/><circle cx="102" cy="49" r="7" fill="#99D0C5"/><text x="1100" y="53" fill="#627783" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="end">ILLUSTRATED GUIDE · NOT A SCREENSHOT</text><rect x="26" y="77" width="265" height="619" rx="0" fill="#F3F6F5" stroke="none" stroke-width="1"/><text x="53" y="117" fill="#193349" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">ChatGPT</text><text x="52" y="157" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">＋  New chat</text><text x="52" y="210" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">⌕  Search chats</text><text x="52" y="263" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">▦  Library</text><text x="52" y="316" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">◎  Explore</text><text x="52" y="369" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">▣  Projects</text><text x="52" y="422" fill="#4C6D71" font-family="Arial, Helvetica, sans-serif" font-size="18" font-