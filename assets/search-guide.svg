="#233449" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start">Official guidance</text><text x="383" y="489" fill="#73828A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" text-anchor="start">Check the publication date</text><rect x="717" y="399" width="349" height="112" rx="13" fill="#F3F7F8" stroke="none" stroke-width="1"/><text x="738" y="433" fill="#126D75" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Legislation NSW</text><text x="738" y="463" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start">Read the relevant clause</text><text x="738" y="489" fill="#73828A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" text-anchor="start">Compare with the AI summary</text><circle cx="1093" cy="212" r="20" fill="#E58E70" stroke="#fff" stroke-width="4"/><text x="1093" y="219" fill="#12263C" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="middle">1</text><circle cx="696" cy="400" r="20" fill="#E58E70" stroke="#fff" stroke-width="4"/><text x="696" y="407" fill="#12263C" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="middle">2</text><text x="370" y="608" fill="#59757E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">If a source does not support the claim, ask for a corrected answer.</text></svg>