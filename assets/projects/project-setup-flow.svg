<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Set up a Project in five stages</title><desc id="desc">Follow this order when creating your first reusable workspace</desc><rect width="1200" height="700" fill="#F4F8F6"/><rect x="26" y="28" width="1148" height="644" rx="25" fill="#fff" stroke="#d6e5e3" stroke-width="2"/><rect x="26" y="28" width="1148" height="78" rx="23" fill="#EDF5F2" stroke="#EDF5F2" stroke-width="2"/><text x="60" y="78" fill="#18384B" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="31" text-anchor="start">Set up a Project in five stages</text><text x="60" y="137" fill="#4E6C72" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start">Follow this order when creating your first reusable workspace</text><rect x="57" y="238" width="206" height="255" rx="17" fill="#EDF5F3" stroke="#d6e5e3" stroke-width="2"/><rect x="79" y="261" width="60" height="58" rx="14" fill="#DAEEE8" stroke="#d6e5e3" stroke-width="2"/><text x="109" y="300" fill="#087A74" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="27" text-anchor="middle">01</text><text x="78" y="368" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" text-anchor="start">Create</text><text x="78" y="402" fill="#536F7A" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="16" text-anchor="start">Choose name and icon</text><path d="M268 356h12m-7-5 7 5-7 5" fill="none" stroke="#5AA49B" stroke-width="3"/><rect x="285" y="238" width="206" height="255" rx="17" fill="#F6FAF8" stroke="#d6e5e3" stroke-width="2"/><rect x="307" y="261" width="60" height="58" rx="14" fill="#DAEEE8" stroke="#d6e5e3" stroke-width="2"/><text x="337" y="300" fill="#087A74" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="27" text-anchor="middle">02</text><text x="306" y="368" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" text-anchor="start">Set rules</text><text x="306" y="402" fill="#536F7A" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="16" text-anchor="start">Add instructions</text><path d="M496 356h12m-7-5 7 5-7 5" fill="none" stroke="#5AA49B" stroke-width="3"/><rect x="513" y="238" width="206" height="255" rx="17" fill="#EDF5F3" stroke="#d6e5e3" stroke-width="2"/><rect x="535" y="261" width="60" height="58" rx="14" fill="#DAEEE8" stroke="#d6e5e3" stroke-width="2"/><text x="565" y="300" fill="#087A74" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="27" text-anchor="middle">03</text><text x="534" y="368" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" text-anchor="start">Add sources</text><text x="534" y="402" fill="#536F7A" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="16" text-anchor="start">Use safe reference files</text><path d="M724 356h12m-7-5 7 5-7 5" fill="none" stroke="#5AA49B" stroke-width="3"/><rect x="741" y="238" width="206" height="255" rx="17" fill="#F6FAF8" stroke="#d6e5e3" stroke-width="2"/><rect x="763" y="261" width="60" height="58" rx="14" fill="#DAEEE8" stroke="#d6e5e3" stroke-width="2"/><text x="793" y="300" fill="#087A74" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="27" text-anchor="middle">04</text><text x="762" y="368" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" text-anchor="start">Start chats</text><text x="762" y="402" fill="#536F7A" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="16" text-anchor="start">Ask a first question</text><path d="M952 356h12m-7-5 7 5-7 5" fill="none" stroke="#5AA49B" stroke-width="3"/><rect x="969" y="238" width="206" height="255" rx="17" fill="#EDF5F3" stroke="#d6e5e3" stroke-width="2"/><rect x="991" y="261" width="60" height="58" rx="14" fill="#DAEEE8" stroke="#d6e5e3" stroke-width="2"/><text x="1021" y="300" fill="#087A74" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="27" text-anchor="middle">05</text><text x="990" y="368" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" text-anchor="start">Maintain</text><text x="990" y="402" fill="#536F7A" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="16" text-anchor="start">Review and update</text><rect x="123" y="553" width="947" height="67" rx="14" fill="#FAF2E9" stroke="#d6e5e3" stroke-width="2"/><text x="169" y="594" fill="#765A42" font-family="Arial,Helvetica,sans-serif" font-weight="650" font-size="19" text-anchor="start">Tip: Start with Building management or Household finances, not 10 projects at once.</text></svg>