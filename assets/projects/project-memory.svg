<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Choose the right memory boundary</title><desc id="desc">A privacy-minded overview of default and project-only context</desc><rect width="1200" height="700" fill="#F4F8F6"/><rect x="26" y="28" width="1148" height="644" rx="25" fill="#fff" stroke="#d6e5e3" stroke-width="2"/><rect x="26" y="28" width="1148" height="78" rx="23" fill="#EDF5F2" stroke="#EDF5F2" stroke-width="2"/><text x="60" y="78" fill="#18384B" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="31" text-anchor="start">Choose the right memory boundary</text><text x="60" y="137" fill="#4E6C72" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start">A privacy-minded overview of default and project-only context</text><rect x="76" y="215" width="496" height="345" rx="19" fill="#EFF6F8" stroke="#d6e5e3" stroke-width="2"/><text x="112" y="271" fill="#1E6884" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="25" text-anchor="start">DEFAULT MEMORY</text><text x="111" y="319" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="20" text-anchor="start">Project chats + relevant settings</text><text x="111" y="360" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="20" text-anchor="start">May use broader account context</text><text x="111" y="409" fill="#4E6C76" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" text-anchor="start">Useful when topics overlap</text><rect x="623" y="215" width="498" height="345" rx="19" fill="#EDF7F1" stroke="#d6e5e3" stroke-width="2"/><text x="658" y="271" fill="#117765" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="25" text-anchor="start">PROJECT-ONLY MEMORY</text><text x="658" y="319" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="20" text-anchor="start">Project chats and sources</text><text x="658" y="360" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="20" text-anchor="start">Kept separate from other projects</text><text x="658" y="409" fill="#4E6C76" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" text-anchor="start">Useful for a sensitive topic</text><rect x="175" y="590" width="854" height="49" rx="11" fill="#fff6ec" stroke="#d6e5e3" stroke-width="2"/><text x="194" y="622" fill="#825F43" font-family="Arial,Helvetica,sans-serif" font-weight="650" font-size="17" text-anchor="start">Check the options shown in Project settings; shared projects use project-only memory.</text></svg>