<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Example: Household Finances Project</title><desc id="desc">Keep bills, budgets and explainers together without storing unnecessary sensitive data</desc><rect width="1200" height="700" fill="#F4F8F6"/><rect x="26" y="28" width="1148" height="644" rx="25" fill="#fff" stroke="#d6e5e3" stroke-width="2"/><rect x="26" y="28" width="1148" height="78" rx="23" fill="#EDF5F2" stroke="#EDF5F2" stroke-width="2"/><text x="60" y="78" fill="#18384B" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="31" text-anchor="start">Example: Household Finances Project</text><text x="60" y="137" fill="#4E6C72" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start">Keep bills, budgets and explainers together without storing unnecessary sensitive data</text><rect x="76" y="202" width="514" height="393" rx="21" fill="#fff" stroke="#d6e5e3" stroke-width="2"/><text x="110" y="257" fill="#21475C" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="25" text-anchor="start">HOUSEHOLD BUDGET</text><text x="110" y="323" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="18" text-anchor="start">Groceries</text><rect x="271" y="304" width="235" height="28" rx="8" fill="#68B1A6" stroke="#d6e5e3" stroke-width="2"/><text x="110" y="384" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="18" text-anchor="start">Utilities</text><rect x="271" y="365" width="115" height="28" rx="8" fill="#ECAD83" stroke="#d6e5e3" stroke-width="2"/><text x="110" y="445" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="18" text-anchor="start">Transport</text><rect x="271" y="426" width="161" height="28" rx="8" fill="#9AC7CF" stroke="#d6e5e3" stroke-width="2"/><text x="110" y="506" fill="#1B384C" font-family="