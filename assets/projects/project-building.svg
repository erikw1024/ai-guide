<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Example: Building Management Project</title><desc id="desc">A fictional strata committee workflow that Robert can practise</desc><rect width="1200" height="700" fill="#F4F8F6"/><rect x="26" y="28" width="1148" height="644" rx="25" fill="#fff" stroke="#d6e5e3" stroke-width="2"/><rect x="26" y="28" width="1148" height="78" rx="23" fill="#EDF5F2" stroke="#EDF5F2" stroke-width="2"/><text x="60" y="78" fill="#18384B" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="31" text-anchor="start">Example: Building Management Project</text><text x="60" y="137" fill="#4E6C72" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start">A fictional strata committee workflow that Robert can practise</text><rect x="78" y="194" width="483" height="408" rx="21" fill="#F4F8F8" stroke="#d6e5e3" stroke-width="2"/><text x="108" y="245" fill="#174B59" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="24" text-anchor="start">BUILDING MANAGEMENT</text><rect x="104" y="277" width="426" height="55" rx="11" fill="#fff" stroke="#d6e5e3" stroke-width="2"/><text x="133" y="311" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" text-anchor="start">Agenda and committee minutes</text><rect x="104" y="347" width="426" height="55" rx="11" fill="#fff" stroke="#d6e5e3" stroke-width="2"/><text x="133" y="381" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" text-anchor="start">Contractor quotations</text><rect x="104" y="417" width="426" height="55" rx="11" fill="#fff" stroke="#d6e5e3" stroke-width="2"/><text x="133" y="451" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" text-anchor="start">Building maintenance tasks</text><rect x="104" y="487" width="426" height="55" rx="11" fill="#fff" stroke="#d6e5e3" stroke-width="2"/><text x="133" y="521" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" text-anchor="start">Resident communications</text><rect x="624" y="220" width="478" height="335" rx="21" fill="#EDF6F2" stroke="#d6e5e3" stroke-width="2"/><text x="663" y="270" fill="#0E756C" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="24" text-anchor="start">Example weekly workflow</text><text x="659" y="325" fill="#0D7770" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="20" text-anchor="start">1.</text><text x="694" y="325" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" text-anchor="start">Summarise meeting decisions</text><text x="659" y="382" fill="#0D7770" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="20" text-anchor="start">2.</text><text x="694" y="382" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" text-anchor="start">List actions, owners and dates</text><text x="659" y="439" fill="#0D7770" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="20" text-anchor="start">3.</text><text x="694" y="439" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" text-anchor="start">Flag missing decisions</text><text x="659" y="496" fill="#0D7770" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="20" text-anchor="start">4.</text><text x="694" y="496" fill="#1B384C" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" text-anchor="start">Draft a resident update</text></svg>