<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Connected apps and permissions</title><desc id="desc">Illustrative settings page showing plugin connection, permissions and safe review</desc><rect x="0" y="0" width="1200" height="720" rx="0" fill="#F4F7F6" stroke="none" stroke-width="1"/><rect x="25" y="22" width="1150" height="676" rx="20" fill="#fff" stroke="#C8D7DA" stroke-width="2"/><rect x="25" y="22" width="1150" height="54" rx="20" fill="#F8FAFB" stroke="none" stroke-width="1"/><circle cx="56" cy="49" r="7" fill="#EE9A93"/><circle cx="79" cy="49" r="7" fill="#F1CF7A"/><circle cx="102" cy="49" r="7" fill="#99D0C5"/><text x="1100" y="53" fill="#627783" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="end">ILLUSTRATED GUIDE · NOT A SCREENSHOT</text><rect x="26" y="77" width="265" height="619" rx="0" fill="#F3F6F5" stroke="none" stroke-width="1"/><text x="53" y="117" fill="#193349" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start">ChatGPT</text><text x="52" y="157" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">＋  New chat</text><text x="52" y="210" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">⌕  Search chats</text><text x="52" y="263" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">▦  Library</text><text x="52" y="316" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">◎  Explore</text><text x="52" y="369" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">▣  Projects</text><text x="52" y="422" fill="#4C6D71" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">  Building matters</text><text x="52" y="475" fill="#4C6D71" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">  Home finances</text><text x="52" y="528" fill="#4C6D71" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">  Learning ChatGPT</text><line x1="38" y1="614" x2="281" y2="614" stroke="#DCE5E7" stroke-width="2" stroke-linecap="round"/><text x="52" y="657" fill="#344D5B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start">⚙  Settings</text><text x="343" y="128" fill="#203A50" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" text-anchor="start">Settings  /  Plugins</text><rect x="337" y="159" width="761" height="332" rx="18" fill="#fff" stroke="#CDD9DB" stroke-width="2"/><text x="366" y="207" fill="#1D3F50" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" text-anchor="start">Connected apps</text><rect x="366" y="234" width="697" height="93" rx="12" fill="#F4F8F8" stroke="none" stroke-width="1"/><text x="393" y="271" fill="#233449" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start">Mail connector (example)</text><text x="393" y="299" fill="#5E7880" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start">Only connect services you trust and need.</text><rect x="916" y="252" width="120" height="49" rx="13" fill="#DDEDE9" stroke="none" stroke-width="1"/><text x="975" y="282" fill="#0B726E" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="750" text-anchor="middle">Review</text><rect x="366" y="348" width="697" height="109" rx="12" fill="#FAF5EA" stroke="none" stroke-width="1"/><text x="392" y="384" fill="#5E542C" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="start">Permission review</text><text x="392" y="417" fill="#425A66" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">What can the app read, search or change?</text><text x="392" y="444" fill="#566C72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start">Only approve access you understand.</text><text x="344" y="576" fill="#6E7D85" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Example only. Actual integrations and settings vary by plan.</text><circle cx="1041" cy="186" r="20" fill="#E58E70" stroke="#fff" stroke-width="4"/><text x="1041" y="193" fill="#12263C" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="middle">1</text><circle cx="1030" cy="348" r="20" fill="#E58E70" stroke="#fff" stroke-width="4"/><text x="1030" y="355" fill="#12263C" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="middle">2</text><circle cx="1051" cy="575" r="20" fill="#E58E70" stroke="#fff" stroke-width="4"/><text x="1051" y="582" fill="#12263C" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="middle">3</text></svg>